<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{brand}}</title><link rel="stylesheet" href="/style.css"></head>
<body><header><span class="eyebrow">COMMUNITY / KNOWLEDGE</span><h1>{{brand}}</h1><p>查看公开内容，维护有据可查的社区知识。</p>{{extensions}}</header>
<main><section><h2>公开知识</h2><form id="search"><input name="query" aria-label="搜索公开知识" placeholder="搜索标题和正文"><button>搜索</button></form><p id="summary" role="status"></p><div id="cards"></div></section>
<section><h2>编辑者登录</h2><p>使用具名账户、密码和验证器中的一次性验证码。会话仅保留在本页内存。</p><form id="login"><label>账户<input name="accountId" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><label>MFA 验证码<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label><button>登录</button><button type="button" id="logout">退出本设备</button></form><p id="identity" role="status">尚未登录</p></section>
<section id="editor" hidden><h2>内容与私有工作流</h2><p>提交社区配置允许的操作。发布需要精确版本及有效证据，失败不会改变已公开内容。</p><form id="operation"><label>操作<select name="route"><option value="content/import">导入不可变内容修订</option><option value="content/publish">发布修订</option><option value="content/hide">隐藏或恢复内容</option><option value="content/source">处置来源</option><option value="private/command">私有工作流</option></select></label><label>操作 JSON<textarea name="payload" rows="10" spellcheck="false" required>{}</textarea></label><button>提交操作</button><button type="button" id="private-list">查看私有记录摘要</button></form><pre id="result" role="status"></pre></section>
</main><footer>公开内容实时从服务器读取；页面不缓存知识快照。</footer><script type="module" src="/app.js"></script></body></html>
